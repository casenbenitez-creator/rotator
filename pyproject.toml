[project]
name = "rotator"
version = "0.1.0"
description = "Local reverse-proxy + TUI for rotating API keys in opencode"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "textual>=0.52",
]

[project.scripts]
rotator = "rotator.__main__:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.setuptools.packages.find]
where = ["src"]
